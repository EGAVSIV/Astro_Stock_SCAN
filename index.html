<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planet Aspects & Stock Scanner</title>
    <link rel="stylesheet" href="style.css">
    <!-- Charting & Parquet Libraries -->
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hyparquet/dist/hyparquet.min.js"></script>
</head>
<body>
    <header>
        <h1>🪐 Planetary Aspects Vs Stock Scanner</h1>
    </header>

    <main>
        <!-- Tab Controls -->
        <div class="controls">
            <label for="planet1">Planet 1:</label>
            <select id="planet1">
                <option value="Sun">Sun</option>
                <option value="Moon">Moon</option>
                <option value="Jupiter">Jupiter</option>
            </select>

            <label for="planet2">Planet 2:</label>
            <select id="planet2">
                <option value="Mars">Mars</option>
                <option value="Saturn">Saturn</option>
            </select>

            <button id="runScanBtn">🔍 Find Aspect Dates</button>
        </div>

        <!-- Output Tables -->
        <section id="resultsSection">
            <h2>Aspect Events</h2>
            <table id="eventsTable"></table>
        </section>

        <!-- Chart View -->
        <div id="chartContainer" style="width: 100%; height: 400px;"></div>
    </main>

    <script src="app.js"></script>
</body>
</html>
