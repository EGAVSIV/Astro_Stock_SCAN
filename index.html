<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AstroScan Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <main class="content">
            <header class="topbar">
                <h1>🪐 Planetary Aspects & Stock Scanner</h1>
                <!-- WORKFLOW BUTTON -->
                <button id="updateDataBtn" class="btn btn-primary" onclick="triggerWorkflow()">
                    <i class="fa-solid fa-sync"></i> Update Data
                </button>
            </header>

            <div id="statusAlert" class="alert-box" style="display: none;"></div>

            <section class="card margin-top">
                <h3>Aspect Events</h3>
                <div class="table-wrapper">
                    <table id="aspectsTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Planet 1</th>
                                <th>Planet 2</th>
                                <th>Aspect</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="5" class="text-center">Loading data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="card margin-top">
                <h3>Scan Results</h3>
                <div class="table-wrapper">
                    <table id="scanResultsTable">
                        <thead>
                            <tr>
                                <th>Symbol</th>
                                <th>Aspect Date</th>
                                <th>Close Price</th>
                                <th>Max %</th>
                                <th>Min %</th>
                                <th>Direction</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="6" class="text-center">Loading data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
